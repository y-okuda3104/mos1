<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="QRコード入力画面">
  <meta name="theme-color" content="#ff7f32">
  <title>QRコード入力 - みどり亭</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }
    
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .input-group {
      margin: 20px 0;
    }
    
    label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
      text-align: left;
      font-size: 14px;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #ff7f32;
    }
    
    input::placeholder {
      color: #bbb;
    }
    
    button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #ff7f32;
      color: white;
    }
    
    .btn-primary:hover {
      background: #ff6b00;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 127, 50, 0.4);
    }
    
    .btn-secondary {
      background: #eee;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #ddd;
    }
    
    .divider {
      margin: 20px 0;
      color: #999;
      font-size: 14px;
    }
    
    .info-text {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }
    
    .error {
      background: #fee;
      color: #c00;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }
    
    .error.show {
      display: block;
    }
    
    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🍶</div>
    <h1>居酒屋みどり亭</h1>
    <p class="subtitle">入店手続き</p>
    
    <div class="input-group">
      <label for="qrInput">QRコードを読み込む</label>
      <input type="text" id="qrInput" placeholder="QRコードを読み込んでください" autofocus>
    </div>
    
    <button class="btn-primary" id="submitBtn">入店開始</button>
    
    <div class="divider">またはマニュアル入力</div>
    
    <div class="input-group">
      <label for="seatInput">座席番号を入力</label>
      <input type="text" id="seatInput" placeholder="例：C-05">
    </div>
    
    <button class="btn-secondary" id="manualBtn">座席番号で入店</button>
    
    <div class="error" id="errorMsg"></div>
    
    <div class="info-text">
      <strong>使用例（テスト用）:</strong><br>
      QRコード欄に「SEAT:C-05」と入力してください
    </div>
  </div>
  
  <script src="shared-state.js"></script>
  <script src="api.js"></script>
  <script>
    const qrInput = document.getElementById('qrInput');
    const seatInput = document.getElementById('seatInput');
    const submitBtn = document.getElementById('submitBtn');
    const manualBtn = document.getElementById('manualBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    // QRコード自動送信（キー入力で完了を検出）
    qrInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        submitQR();
      }
    });
    
    submitBtn.addEventListener('click', submitQR);
    manualBtn.addEventListener('click', submitManual);
    
    async function submitQR() {
      const qrCode = qrInput.value.trim();
      if (!qrCode) {
        showError('QRコードを入力してください');
        return;
      }
      
      try {
        const result = await API.validateQRCode(qrCode);
        if (result.valid && result.seatId) {
          AppState.setSeatId(result.seatId);
          window.location.href = 'top_menu.html';
        } else {
          showError('無効なQRコードです');
        }
      } catch (error) {
        console.error('QR validation error:', error);
        showError('コード読み込みエラーが発生しました');
      }
    }
    
    function submitManual() {
      const seat = seatInput.value.trim();
      if (!seat) {
        showError('座席番号を入力してください');
        return;
      }
      
      // 座席番号をノーマライズ (C-05 または C05 など)
      const normalized = seat.toUpperCase().replace(/\s+/g, '');
      const match = normalized.match(/^([A-Z])-?(\d{1,2})$/);
      
      if (match) {
        const seatId = `${match[1]}-${String(parseInt(match[2], 10)).padStart(2, '0')}`;
        AppState.setSeatId(seatId);
        window.location.href = 'top_menu.html';
      } else {
        showError('座席番号の形式が正しくありません（例：C-05）');
      }
    }
    
    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add('show');
      setTimeout(() => {
        errorMsg.classList.remove('show');
      }, 5000);
    }
  </script>
</body>
</html>
