<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="みどり亭 お会計" />
  <meta name="theme-color" content="#ff7f32" />
  <title>みどり亭｜お会計</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
    }

    .app-header {
      background: linear-gradient(135deg, #ff7f32 0%, #ff6b00 100%);
      color: white;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .app-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .checkout-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .checkout-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      border-bottom: 2px solid #ff7f32;
      padding-bottom: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #666;
      font-weight: 500;
    }

    .info-value {
      color: #333;
      font-weight: 600;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      font-size: 20px;
      font-weight: 700;
      background: #fff3e0;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .total-amount {
      color: #ff7f32;
    }

    .payment-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff7f32 0%, #ff6b00 100%);
      color: white;
      grid-column: 1 / -1;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 127, 50, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .cart-items {
      max-height: 300px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-name {
      flex: 1;
      color: #333;
    }

    .item-qty {
      background: #f0f0f0;
      padding: 2px 8px;
      border-radius: 4px;
      margin: 0 8px;
      color: #666;
      font-size: 12px;
    }

    .item-price {
      color: #ff7f32;
      font-weight: 600;
      min-width: 60px;
      text-align: right;
    }

    .empty-message {
      text-align: center;
      color: #999;
      padding: 30px 20px;
      font-size: 14px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 300px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
    }

    .modal-message {
      color: #666;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #ff7f32;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 16px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1001;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header class="app-header">
    <h1>💳 お会計</h1>
  </header>

  <!-- メインコンテンツ -->
  <main class="container">
    <!-- 座席・合計情報 -->
    <div class="checkout-card">
      <div class="checkout-title">ご注文内容</div>
      
      <div class="info-row">
        <span class="info-label">ご利用座席</span>
        <span class="info-value" id="seatInfo">--</span>
      </div>

      <div class="info-row">
        <span class="info-label">ご注文品数</span>
        <span class="info-value" id="itemCountInfo">0</span>
      </div>

      <div class="total-row">
        <span>合計金額</span>
        <span class="total-amount" id="totalAmount">¥0</span>
      </div>
    </div>

    <!-- カート内容 -->
    <div class="checkout-card">
      <div class="checkout-title">注文一覧</div>
      <div class="cart-items" id="cartItems">
        <div class="empty-message">カートが空です</div>
      </div>
    </div>

    <!-- 支払い方法 -->
    <div class="checkout-card">
      <div class="checkout-title">お支払い方法</div>
      <div class="payment-methods">
        <button class="btn btn-secondary" id="cashBtn" type="button">
          💰 現金
        </button>
        <button class="btn btn-secondary" id="cardBtn" type="button">
          💳 カード
        </button>
        <button class="btn btn-primary" id="completeBtn" type="button">
          お支払い完了
        </button>
      </div>
    </div>

    <!-- 戻るボタン -->
    <div style="text-align: center; margin-bottom: 20px;">
      <button id="backBtn" class="btn btn-secondary" type="button" style="max-width: 200px;">
        ← トップメニューに戻る
      </button>
    </div>
  </main>

  <!-- 支払い処理中モーダル -->
  <div id="processingModal" class="modal">
    <div class="modal-content">
      <div class="spinner"></div>
      <div class="modal-title">支払い処理中...</div>
      <div class="modal-message">お待ちください</div>
    </div>
  </div>

  <!-- 支払い完了モーダル -->
  <div id="completeModal" class="modal">
    <div class="modal-content">
      <div style="font-size: 40px; margin-bottom: 12px;">✓</div>
      <div class="modal-title">お支払いありがとうございました</div>
      <div class="modal-message">またのご来店をお待ちしております</div>
      <button id="returnHomeBtn" class="btn btn-primary" type="button" style="margin-top: 16px;">
        トップページに戻る
      </button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="shared-state.js"></script>
  <script src="api.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
