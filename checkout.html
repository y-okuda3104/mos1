<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>お会計 - みどり亭</title>
  <link rel="stylesheet" href="top_menu.css">
  <style>
    .checkout-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    
    .loading-state {
      text-align: center;
      padding: 60px 20px;
    }
    
    .loading-state h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #ff7f32;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .completed-state {
      text-align: center;
      padding: 40px 20px;
    }
    
    .completed-state .icon {
      font-size: 64px;
      margin: 20px 0;
    }
    
    .receipt {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
    }
    
    .receipt-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    
    .receipt-item:last-child {
      border-bottom: none;
    }
    
    .receipt-total {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      margin-top: 12px;
      border-top: 2px solid #333;
      font-weight: bold;
      font-size: 18px;
    }
    
    .btn-return {
      display: block;
      margin: 20px auto;
      padding: 12px 40px;
      background: #ff7f32;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    
    .btn-return:hover {
      background: #ff6b00;
    }
  </style>
</head>
<body>
  <header class="app-header" role="banner">
    <h1>お会計</h1>
  </header>
  
  <main class="checkout-container" id="checkoutContent">
    <div class="loading-state">
      <h2>会計処理中</h2>
      <p>会計をお受けしています。お待たせします。</p>
      <div class="loading-spinner"></div>
    </div>
  </main>
  
  <script src="shared-state.js"></script>
  <script src="api.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
